name: v3 원본검증 → 7개언어 한국어판 → 웹설치
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [".github/workflows/**","korean/**","README.md"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poke-ko-v3-pages
  cancel-in-progress: true

env:
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 최신 원본 TamaPoke 받기
        run: |
          git clone --depth 1 https://github.com/socquique/TamaPoke.git upstream
          echo "UPSTREAM=$(git -C upstream rev-parse HEAD)"

      - name: Arduino CLI 설치
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: ESP32 및 라이브러리 설치
        run: |
          bin/arduino-cli config init --overwrite
          bin/arduino-cli config add board_manager.additional_urls "$ESP32_INDEX"
          bin/arduino-cli core update-index
          bin/arduino-cli core install esp32:esp32
          bin/arduino-cli lib install "GFX Library for Arduino"
          bin/arduino-cli lib install "SensorLib"
          bin/arduino-cli lib install "XPowersLib"
          bin/arduino-cli lib install "U8g2"
          python -m pip install --upgrade esptool

      - name: "① 원본 무수정 빌드"
        working-directory: upstream
        run: ../bin/arduino-cli compile --fqbn "$FQBN" .

      - name: "② v3 패치 및 구조 검증"
        run: |
          python korean/patch_v3.py upstream
          python korean/verify_v3.py upstream
          python korean/patch_web.py upstream

      - name: "③ 7개 언어 한국어판 빌드"
        working-directory: upstream
        run: ../bin/arduino-cli compile --fqbn "$FQBN" .

      - name: "④ 원본 build_web.sh 웹 패키징"
        working-directory: upstream
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          bash tools/build_web.sh
          test -s web/firmware/tamapoke.bin
          test -s web/sprites.pak

      - name: "⑤ 웹 표시 한국어 재적용"
        run: python korean/patch_web.py upstream

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: upstream/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
