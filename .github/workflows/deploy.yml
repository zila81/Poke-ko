name: v3 원본검증 → 7개언어 한국어판 → 웹설치

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"
      - "korean/**"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poke-ko-v3-pages
  cancel-in-progress: true

env:
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Poke-ko 받기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 최신 원본 TamaPoke 받기
        run: |
          git clone --depth 1 https://github.com/socquique/TamaPoke.git TamaPoke
          echo "UPSTREAM=$(git -C TamaPoke rev-parse HEAD)"
          test -f TamaPoke/TamaPoke.ino
          echo "✅ Arduino sketch 확인: TamaPoke/TamaPoke.ino"

      - name: Arduino CLI 설치
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: ESP32 및 라이브러리 설치
        run: |
          bin/arduino-cli config init --overwrite
          bin/arduino-cli config add board_manager.additional_urls "$ESP32_INDEX"
          bin/arduino-cli core update-index
          bin/arduino-cli core install esp32:esp32
          bin/arduino-cli lib install "GFX Library for Arduino"
          bin/arduino-cli lib install "SensorLib"
          bin/arduino-cli lib install "XPowersLib"
          bin/arduino-cli lib install "U8g2"
          python -m pip install --upgrade esptool

      - name: "① 원본 무수정 빌드"
        working-directory: TamaPoke
        run: |
          ../bin/arduino-cli compile --fqbn "$FQBN" .
          echo "✅ 원본 TamaPoke 빌드 성공"

      - name: "② v3 패치 및 구조 검증"
        run: |
          python korean/patch_v3.py TamaPoke
          python korean/verify_v3.py TamaPoke
          python korean/patch_web.py TamaPoke
          echo "✅ 한국어 v3 패치 완료"

      - name: "③ 7개 언어 한국어판 빌드"
        working-directory: TamaPoke
        run: |
          ../bin/arduino-cli compile --fqbn "$FQBN" .
          echo "✅ 한국어판 빌드 성공"

      - name: "④ 원본 build_web.sh 웹 패키징"
        working-directory: TamaPoke
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          bash tools/build_web.sh
          test -s web/firmware/tamapoke.bin
          test -s web/sprites.pak
          ls -lh web/firmware/tamapoke.bin
          ls -lh web/sprites.pak
          echo "✅ 웹 설치 파일 생성 성공"

      - name: "⑤ 웹 표시 한국어 재적용"
        run: |
          python korean/patch_web.py TamaPoke

      - name: GitHub Pages 구성
        uses: actions/configure-pages@v6

      - name: Pages 파일 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: TamaPoke/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
